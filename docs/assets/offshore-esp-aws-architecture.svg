<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Offshore ESP data platform on AWS</title>
  <desc id="description">High-level data flow for batch and realtime ESP telemetry, using AWS service icons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#55616f"/></marker>
    <style>
      .canvas { fill: #ffffff; }
      .zone { fill: #f7f8fa; stroke: #aab7c4; stroke-width: 2; stroke-dasharray: 7 7; }
      .ephemeral { fill: #fff8f1; stroke: #ff9900; stroke-width: 2; stroke-dasharray: 7 7; }
      .flow { fill: none; stroke: #55616f; stroke-width: 3; marker-end: url(#arrow); }
      .event { fill: none; stroke: #55616f; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .label { font-family: Arial, sans-serif; font-size: 21px; font-weight: 600; fill: #182b3a; text-anchor: middle; }
      .zone-label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.2px; fill: #334e68; }
      .small { font-family: Arial, sans-serif; font-size: 16px; fill: #55616f; text-anchor: middle; }
      .source { fill: #ffffff; stroke: #8d99a6; stroke-width: 2; rx: 14; }
      .source-text { font-family: Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #182b3a; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="900"/>
  <text x="72" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#161e2d">Offshore ESP Data Platform</text>

  <rect class="zone" x="420" y="100" width="1110" height="710" rx="18"/>
  <text class="zone-label" x="452" y="135">AWS CLOUD · PERSISTENT CORE</text>
  <rect class="ephemeral" x="455" y="175" width="650" height="255" rx="14"/>
  <text class="zone-label" x="480" y="208" fill="#9b5d00">EPHEMERAL REALTIME</text>

  <!-- Producers -->
  <rect class="source" x="70" y="250" width="230" height="96"/>
  <text class="source-text" x="185" y="291">ESP Simulator</text>
  <text class="small" x="185" y="320">telemetry events</text>
  <rect class="source" x="70" y="624" width="230" height="96"/>
  <text class="source-text" x="185" y="665">Historical CSV</text>
  <text class="small" x="185" y="694">batch telemetry</text>

  <!-- Realtime -->
  <image x="500" y="260" width="88" height="88" xlink:href="aws-icons/kinesis.svg" href="aws-icons/kinesis.svg"/>
  <text class="label" x="544" y="384">Kinesis</text>

  <image x="708" y="250" width="88" height="88" xlink:href="aws-icons/lambda.svg" href="aws-icons/lambda.svg"/>
  <text class="label" x="752" y="374">Ingest</text>

  <image x="890" y="250" width="88" height="88" xlink:href="aws-icons/lambda.svg" href="aws-icons/lambda.svg"/>
  <text class="label" x="934" y="374">Anomaly</text>

  <!-- Persistent operational -->
  <image x="1190" y="245" width="88" height="88" xlink:href="aws-icons/dynamodb.svg" href="aws-icons/dynamodb.svg"/>
  <text class="label" x="1234" y="371">Latest State</text>

  <image x="1372" y="245" width="88" height="88" xlink:href="aws-icons/sns.svg" href="aws-icons/sns.svg"/>
  <text class="label" x="1416" y="371">Alerts</text>

  <!-- Lake and analytics -->
  <image x="530" y="565" width="94" height="94" xlink:href="aws-icons/s3.svg" href="aws-icons/s3.svg"/>
  <text class="label" x="577" y="700">Data Lake</text>
  <text class="small" x="577" y="727">raw · curated</text>

  <image x="785" y="565" width="94" height="94" xlink:href="aws-icons/glue.svg" href="aws-icons/glue.svg"/>
  <text class="label" x="832" y="700">Glue ETL</text>

  <image x="1027" y="565" width="94" height="94" xlink:href="aws-icons/step-functions.svg" href="aws-icons/step-functions.svg"/>
  <text class="label" x="1074" y="700">Workflow</text>

  <image x="1270" y="565" width="94" height="94" xlink:href="aws-icons/athena.svg" href="aws-icons/athena.svg"/>
  <text class="label" x="1317" y="700">Athena</text>

  <!-- Data flows -->
  <path class="flow" d="M300 298 H492"/>
  <path class="flow" d="M588 304 H700"/>
  <path class="flow" d="M588 280 C690 142 815 142 890 280"/>
  <path class="flow" d="M752 338 V470 H1234 V343"/>
  <path class="flow" d="M752 338 V502 H577 V557"/>
  <path class="flow" d="M978 300 H1362"/>
  <path class="flow" d="M300 672 H520"/>
  <path class="flow" d="M624 612 H775"/>
  <path class="flow" d="M785 642 H624"/>
  <path class="flow" d="M624 642 C850 790 1160 790 1280 660"/>
  <path class="event" d="M1074 565 V505 H832 V557"/>
</svg>
