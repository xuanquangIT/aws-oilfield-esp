name: Deploy hosted dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/static/**"
      - "src/dashboard_api/**"
      - "infrastructure/dashboard_hosted_stack.py"
      - "infrastructure/core_stack.py"
      - "app.py"
      - "requirements*.txt"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy authenticated dashboard
    runs-on: ubuntu-latest
    environment: dashboard-production
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DASHBOARD_ROLE_ARN: ${{ vars.AWS_DASHBOARD_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest tests/test_dashboard.py tests/test_dashboard_ui.py tests/test_infrastructure.py -q
      - run: npx cdk synth oilfield-esp-dashboard-hosted --quiet
      - name: Require protected-environment role variable
        run: test -n "$DASHBOARD_ROLE_ARN"
      - name: Verify GitHub OIDC claim boundary
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1] + "=" * (-len(token.split(".")[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({key: claims.get(key) for key in ("sub", "aud", "repository", "ref", "environment")}, sort_keys=True))
          assert claims["aud"] == "sts.amazonaws.com"
          PY
      - name: Obtain short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DASHBOARD_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: dashboard-${{ github.run_id }}
      - name: Deploy and configure OAuth redirects
        run: |
          npx cdk deploy oilfield-esp-dashboard-hosted --require-approval never
          python scripts/configure-hosted-auth.py
