name: Deploy hosted dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/static/**"
      - "src/dashboard_api/**"
      - "infrastructure/dashboard_hosted_stack.py"
      - "infrastructure/core_stack.py"
      - "app.py"
      - "requirements*.txt"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy authenticated dashboard
    runs-on: ubuntu-latest
    environment: dashboard-production
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      DASHBOARD_ROLE_ARN: ${{ vars.AWS_DASHBOARD_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest tests/test_dashboard.py tests/test_dashboard_ui.py tests/test_dashboard_hosted.py tests/test_infrastructure.py -q
      - run: npx cdk synth oilfield-esp-dashboard-hosted --quiet
      - name: Require protected-environment role variable
        run: test -n "$DASHBOARD_ROLE_ARN"
      - name: Obtain short-lived AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DASHBOARD_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: dashboard-${{ github.run_id }}
      - name: Deploy and configure OAuth redirects
        run: |
          npx cdk deploy oilfield-esp-dashboard-hosted --require-approval never
          python scripts/configure-hosted-auth.py
